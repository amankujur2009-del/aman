<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>For Saanvi 💗</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="particles"></div>

<main>
  <div class="intro">
    <div class="tiny">A tiny surprise for you</div>
    <h1 id="hint">Tap the card 💌</h1>
    <p id="sub">Go on… try opening it.</p>
  </div>

  <div class="card-area" id="cardArea">
    <div class="envelope" id="envelope">
      <div class="paper">
        <div class="paper-inner">
          <div class="flower">🌷</div>
          <h2>Saanvi</h2>
          <h3>Get Well Soon Babe 😉</h3>
          <p id="mainMessage">Rest well, take care of yourself, and get better soon. 💗</p>
          <div class="from">— Aman ✨</div>
        </div>
      </div>
      <div class="back"></div>
      <div class="flap"></div>
      <div class="front"></div>
      <div class="seal">💗</div>
    </div>
  </div>

  <button id="tapBtn">Tap & try 💌</button>

  <section class="final" id="final">
    <div class="burst">✨ 💗 ✨</div>
    <h2>Okayyy, you made it 😌</h2>
    <p>Now stop pretending you don't like the card.</p>
    <button id="again">Replay ↻</button>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
